<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>广东省佛山市顺德区九洲实验学校 - 企业微信加入邀请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #165DFF, #4080FF);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .card-box {
            background: #fff;
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 520px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,60,180,0.25);
        }
        /* 学校LOGO样式 */
        .school-logo {
            width: 220px;
            height: 140px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .school-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .sub-title {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .invite-desc {
            background: #f5f7fa;
            padding: 18px 15px;
            border-radius: 12px;
            color: #333;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.7;
        }
        .join-btn {
            display: block;
            width: 100%;
            background: #165DFF;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            padding: 16px 0;
            border-radius: 12px;
            transition: 0.2s;
        }
        .join-btn:active {
            background: #0e4bdb;
        }
        .tip-text {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card-box">
        <!-- 学校建筑LOGO -->
        <div class="school-logo">
            <img src="图片1.png" alt="广东省佛山市顺德区九洲实验学校">
        </div>
        <h1>广东省佛山市顺德区九洲实验学校</h1>
        <div class="sub-title">企业微信成员加入邀请</div>
        <div class="invite-desc">
            点击链接加入我的企业“广东省佛山市顺德区九洲实验学校”，一起开启全新办公体验吧。
        </div>
        <a href="https://work.weixin.qq.com/join/NcP5sYNePuSwwqZzRWjvfA/hb_share_mng_contacts" class="join-btn">立即加入企业微信</a>
        <div class="tip-text">温馨提示：建议在微信内打开本页面跳转加入</div>
    </div>
</body>
</html>
